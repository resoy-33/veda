services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integrity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: integrity
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integrity -d integrity"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://integrity:${POSTGRES_PASSWORD:-devpassword}@db:5432/integrity
      HEDERA_NETWORK: ${HEDERA_NETWORK:-testnet}
      HEDERA_OPERATOR_ID: ${HEDERA_OPERATOR_ID:-}
      HEDERA_OPERATOR_KEY: ${HEDERA_OPERATOR_KEY:-}
      HEDERA_MIRROR_URL: ${HEDERA_MIRROR_URL:-https://testnet.mirrornode.hedera.com}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32bytes}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
